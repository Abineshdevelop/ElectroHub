name: Test SSH Key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check SSH Secret
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem

          echo "First line:"
          head -1 key.pem

          echo "Last line:"
          tail -1 key.pem

          echo "Line count:"
          wc -l key.pem

          echo "Try parsing key:"
          ssh-keygen -y -f key.pem || true
