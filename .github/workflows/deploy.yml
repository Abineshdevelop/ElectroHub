name: Test SSH Key

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Inspect key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem

          echo "----- FIRST LINE -----"
          head -1 key.pem

          echo "----- LAST LINE -----"
          tail -1 key.pem

          echo "----- LINE COUNT -----"
          wc -l key.pem

          echo "----- FILE TYPE -----"
          file key.pem

          echo "----- HEX OF FIRST 32 BYTES -----"
          xxd -l 32 key.pem

          echo "----- HEX OF LAST 32 BYTES -----"
          tail -c 32 key.pem | xxd

          echo "----- PARSE -----"
          ssh-keygen -y -f key.pem
